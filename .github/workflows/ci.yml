name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Write sample files
        run: |
          printf 'DATABASE_URL=\nAPI_KEY=changeme\n' > .env.example
          printf 'DATABASE_URL=postgres://localhost/app\nAPI_KEY=abc\n' > .env.ci
      - name: Example-only check
        uses: ./
      - name: Full check
        uses: ./
        with:
          env: .env.ci
          strict: "true"
